version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-innovatech
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: innovatech_db
      MYSQL_USER: innovatech
      MYSQL_PASSWORD: innovatech123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech-network

  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: backend-despachos
    restart: always
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: innovatech_db
      DB_USERNAME: innovatech
      DB_PASSWORD: innovatech123
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - innovatech-network

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: backend-ventas
    restart: always
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: innovatech_db
      DB_USERNAME: innovatech
      DB_PASSWORD: innovatech123
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    networks:
      - innovatech-network

  frontend:
    build:
      context: ./front_despacho
    container_name: frontend-innovatech
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-despachos
      - backend-ventas
    networks:
      - innovatech-network

volumes:
  mysql_data:
    driver: local

networks:
  innovatech-network:
    driver: bridge
