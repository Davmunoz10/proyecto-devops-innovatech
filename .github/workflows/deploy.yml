name: Deploy Innovatech to AWS

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Ejecutar comandos de despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Conexión exitosa a AWS ==="
            
            # Navegar a la carpeta del proyecto en el servidor (ajústala si tu carpeta tiene otro nombre)
            cd ~/proyecto-semestral || cd ~
            
            echo "=== Bajando contenedores anteriores ==="
            docker compose down || true
            
            echo "=== Reconstruyendo imágenes con los nuevos Dockerfiles ==="
            docker compose up --build -d
            
            echo "=== ¡Despliegue automatizado completado con éxito! ==="
